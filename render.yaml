# Render Blueprint: New > Blueprint > pick this repo. Free plan is fine for the demo.
services:
  - type: web
    name: greenmile
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.0
